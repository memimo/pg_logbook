    --input-bg:#fffdf7; --input-border:#d4c7ad;

    --ghost:#6b6051; --ghost-hover:#e7dfca;
    --row-bg:#faf6ec; --row-border:#ddd1ba; --row-hover:#f3edde;

<body>
<div class="wrap" id="app"></div>
<input id="fileInput" type="file" accept=".igc,.IGC" multiple style="display:none" />
<input id="folderInput" type="file" webkitdirectory directory multiple style="display:none" />
<script>
"use strict";

/* ============================ persistence (IndexedDB + fallback) ============================ */
const DB = "pglog", STORE = "kv";
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvGet(key) {
  try {
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const t = db.transaction(STORE, "readonly").objectStore(STORE).get(key);
      t.onsuccess = () => res(t.result);
      t.onerror = () => rej(t.error);
    });
  } catch (e) {
    try { const v = localStorage.getItem(DB + ":" + key); return v ? JSON.parse(v) : undefined; }
    catch (_) { return undefined; }
  }
}
async function kvSet(key, val) {
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const t = db.transaction(STORE, "readwrite").objectStore(STORE).put(val, key);
      t.onsuccess = () => res();
      t.onerror = () => rej(t.error);
    });
  } catch (e) {
    try { localStorage.setItem(DB + ":" + key, JSON.stringify(val)); } catch (_) {}
  }
}

/* ============================ IGC parsing & flight detection ============================ */
function parseIGC(text) {
  const lines = text.split(/\r?\n/);
  let dateStr = null, glider = "", pilot = "", device = "";
  const fixes = [];
  for (const line of lines) {
    if (line.startsWith("HFDTE")) {
      const m = line.match(/(\d{2})(\d{2})(\d{2})/);
      if (m) dateStr = "20" + m[3] + "-" + m[2] + "-" + m[1];
    } else if (line.startsWith("HFGTYGLIDERTYPE:")) glider = line.split(":").slice(1).join(":").trim();
    else if (line.startsWith("HFPLTPILOTINCHARGE:")) pilot = line.split(":").slice(1).join(":").trim();
    else if (line.startsWith("HFFTYFRTYPE:")) device = line.split(":").slice(1).join(":").trim().replace(/_/g, " ");
    else if (line[0] === "B" && line.length >= 35) {
      const hh = +line.slice(1, 3), mm = +line.slice(3, 5), ss = +line.slice(5, 7);
      const latDeg = +line.slice(7, 9), latMin = +line.slice(9, 14) / 1000;
      const lonDeg = +line.slice(15, 18), lonMin = +line.slice(18, 23) / 1000;
      let lat = latDeg + latMin / 60; if (line[14] === "S") lat = -lat;
      let lon = lonDeg + lonMin / 60; if (line[23] === "W") lon = -lon;
      const pAlt = +line.slice(25, 30), gAlt = +line.slice(30, 35);
      if (isNaN(hh) || isNaN(lat) || isNaN(lon)) continue;
      fixes.push({ t: hh * 3600 + mm * 60 + ss, lat, lon, alt: gAlt > 0 ? gAlt : pAlt });
    }
  }
  for (let i = 1; i < fixes.length; i++) while (fixes[i].t < fixes[i - 1].t) fixes[i].t += 86400;
  return { dateStr, glider, pilot, device, fixes };
}
function haversine(a, b) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
const smoothArr = (arr, win) => arr.map((_, i) => {
  let s = 0, c = 0;
  for (let j = Math.max(0, i - win); j <= Math.min(arr.length - 1, i + win); j++) { s += arr[j]; c++; }
  return s / c;
});
function detectFlight(fixes) {
  if (fixes.length < 10) return null;
  const n = fixes.length;
  const rawSpd = fixes.map((f, i) => (i === 0 ? 0 : haversine(fixes[i - 1], f) / Math.max(1, f.t - fixes[i - 1].t)));
  const spd = smoothArr(rawSpd, 3);
  const rawVario = fixes.map((f, i) => (i === 0 ? 0 : (f.alt - fixes[i - 1].alt) / Math.max(1, f.t - fixes[i - 1].t)));
  const vario = smoothArr(rawVario, 5);
  const flyingAt = (i) => spd[i] > 2.0 || Math.abs(vario[i]) > 0.6;
  let segments = [], segStart = null;
  for (let i = 0; i < n; i++) {
    if (flyingAt(i)) { if (segStart === null) segStart = i; }
    else { if (segStart !== null) { if (fixes[i - 1].t - fixes[segStart].t >= 15) segments.push([segStart, i - 1]); segStart = null; } }
  }
  if (segStart !== null && fixes[n - 1].t - fixes[segStart].t >= 15) segments.push([segStart, n - 1]);
  if (!segments.length) return null;
  const landAltRef = fixes[n - 1].alt;
  const merged = [segments[0]];
  for (let k = 1; k < segments.length; k++) {
    const prev = merged[merged.length - 1], gapStart = prev[1], gapEnd = segments[k][0];
    const gapSec = fixes[gapEnd].t - fixes[gapStart].t, altChange = Math.abs(fixes[gapEnd].alt - fixes[gapStart].alt);
    let mn = Infinity, mx = -Infinity;
    for (let j = gapStart; j <= gapEnd; j++) { mn = Math.min(mn, fixes[j].alt); mx = Math.max(mx, fixes[j].alt); }
    if (gapSec < 120 || altChange > 10 || mx - mn > 8 || mn > landAltRef + 25) prev[1] = segments[k][1];
    else merged.push(segments[k]);
  }
  let core = merged[0];
  for (const seg of merged) if (fixes[seg[1]].t - fixes[seg[0]].t > fixes[core[1]].t - fixes[core[0]].t) core = seg;
  let takeoffIdx = core[0], landingIdx = core[1];
  const isQuietFrom = (start) => {
    const base = fixes[start]; let j = start;
    while (j < n && fixes[j].t - base.t < 60) {
      if (haversine(base, fixes[j]) > 12 || Math.abs(fixes[j].alt - base.alt) > 8) return false;
      j++;
    }
    return true;
  };
  while (landingIdx < n - 1 && !isQuietFrom(Math.min(n - 1, landingIdx + 1))) landingIdx++;
  const landT = fixes[landingIdx].t;
  while (landingIdx < n - 1 && fixes[landingIdx + 1].t - landT <= 10) landingIdx++;
  return { takeoffIdx, landingIdx };
}
/* ---- cross-country scoring (approximate; optimised turnpoints over a simplified track) ----
   straight (2 pts): farthest start->finish. free (5 pts): best path via up to 3 turnpoints.
   triangle: 3 turnpoints; closed when start..finish gap < 20% of perimeter; FAI if shortest leg >= 28%.
   scored triangle distance = perimeter - closing gap (applied before the points multiplier).
   XContest (PG): free 1.0; flat tri 1.2 (<20%) / 1.4 (<5%); FAI tri 1.4 (<20%) / 1.6 (<5%).
   OLC-PHG:       free 1.5; flat tri 1.75; FAI tri 2.0.
   Sources: xcontest.org/world/en/rules, onlinecontest.org OLC-PHG rules.            */
function resamplePts(pts, maxN) {
  if (pts.length <= maxN) return pts;
  const out = [];
  for (let i = 0; i < maxN; i++) out.push(pts[Math.round((i / (maxN - 1)) * (pts.length - 1))]);
  return out;
}
function scorePoints(rawPts) {
  const pts = resamplePts(rawPts, 90);
  const n = pts.length;
  if (n < 4) return null;
  const P = pts.map((p) => ({ lat: p[0], lon: p[1] }));
  const D = (i, j) => haversine(P[i], P[j]);

  // straight line (2 points): max distance between any two time-ordered fixes
  let straight = 0;
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { const d = D(i, j); if (d > straight) straight = d; }

  // free distance via up to 3 turnpoints (5 points) — DP over 4 legs
  let prev = new Array(n).fill(0);
  const parents = [];
  for (let leg = 1; leg <= 4; leg++) {
    const cur = new Array(n).fill(-1), par = new Array(n).fill(-1);
    for (let j = 0; j < n; j++) {
      let best = -1, bi = -1;
      for (let i = 0; i <= j; i++) { if (prev[i] < 0) continue; const v = prev[i] + D(i, j); if (v > best) { best = v; bi = i; } }
      cur[j] = best; par[j] = bi;
    }
    prev = cur; parents.push(par);
  }
  let free = 0, endIdx = 0;
  for (let j = 0; j < n; j++) if (prev[j] > free) { free = prev[j]; endIdx = j; }
  let idx = endIdx; const freeIdx = [idx];
  for (let leg = parents.length - 1; leg >= 0; leg--) { idx = parents[leg][idx]; if (idx < 0) break; freeIdx.unshift(idx); }
  const freeVerts = freeIdx.map((i) => [P[i].lat, P[i].lon]);

  // best triangle (3 turnpoints maximising perimeter)
  let triPerim = 0, tv = null, legs = null;
  for (let a = 0; a < n; a++) {
    for (let c = a + 2; c < n; c++) {
      const dac = D(a, c);
      let bestMid = -1, bIdx = -1;
      for (let b = a + 1; b < c; b++) { const v = D(a, b) + D(b, c); if (v > bestMid) { bestMid = v; bIdx = b; } }
      if (bIdx < 0) continue;
      const perim = bestMid + dac;
      if (perim > triPerim) { triPerim = perim; tv = [a, bIdx, c]; legs = [D(a, bIdx), D(bIdx, c), dac]; }
    }
  }
  // closing gap: best return near the launch area (first/last ~20% of track)
  const k = Math.max(1, Math.floor(n * 0.2));
  let gap = Infinity;
  for (let a = 0; a <= k; a++) for (let b = n - 1 - k; b < n; b++) { const d = D(a, b); if (d < gap) gap = d; }

  const triValid = triPerim >= 1000 && tv;
  const closePct = triValid ? gap / triPerim : 1;
  const closed20 = triValid && closePct <= 0.20;
  const closed5 = triValid && closePct <= 0.05;
  const isFAI = triValid && Math.min(...legs) / triPerim >= 0.28;
  const triVerts = triValid ? tv.map((i) => [P[i].lat, P[i].lon]) : null;

  const km = (m) => m / 1000;
  const triScoredM = Math.max(0, triPerim - gap);
  // XContest: pick best discipline (closing gap subtracted before the multiplier)
  let xcPts = km(free) * 1.0, xcType = "Free flight";
  if (closed20) {
    const coeff = isFAI ? (closed5 ? 1.6 : 1.4) : (closed5 ? 1.4 : 1.2);
    const p = km(triScoredM) * coeff;
    if (p > xcPts) { xcPts = p; xcType = (isFAI ? "FAI triangle" : "Flat triangle") + (closed5 ? " (<5%)" : ""); }
  }
  // OLC-PHG: free 1.5, triangle scored = perimeter - gap
  let olcPts = km(free) * 1.5, olcType = "Free distance";
  if (closed20) {
    const scored = km(triScoredM);
    const p = scored * (isFAI ? 2.0 : 1.75);
    if (p > olcPts) { olcPts = p; olcType = isFAI ? "FAI triangle" : "Flat triangle"; }
  }
  return {
    straight: +km(straight).toFixed(2), free: +km(free).toFixed(2),
    triPerim: triValid ? +km(triPerim).toFixed(2) : 0,
    triScored: triValid ? +km(Math.max(0, triPerim - gap)).toFixed(2) : 0,
    closePct: triValid ? +(closePct * 100).toFixed(1) : null,
    closed20, closed5, isFAI, triValid: !!triValid,
    xcPoints: +xcPts.toFixed(2), xcType, olcPoints: +olcPts.toFixed(2), olcType,
    freeVerts, triVerts,
  };
}

function downsample(arr, n) {
  if (!arr.length) return [];
  const out = [];
  for (let i = 0; i < n; i++) out.push(arr[Math.min(arr.length - 1, Math.round((i / (n - 1)) * (arr.length - 1)))]);
  return out;
}
function downsampleTrack(fixes, n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const f = fixes[Math.min(fixes.length - 1, Math.round((i / (n - 1)) * (fixes.length - 1)))];
    out.push([+f.lat.toFixed(5), +f.lon.toFixed(5)]);
  }
  return out;
}
function analyze(parsed) {
  const { fixes } = parsed;
  if (fixes.length < 10) return null;
  const det = detectFlight(fixes), n = fixes.length;
  const toIdx = det ? det.takeoffIdx : 0, lnIdx = det ? det.landingIdx : n - 1;
  const flight = fixes.slice(toIdx, lnIdx + 1);
  const vario = smoothArr(flight.map((f, i) => (i ? (f.alt - flight[i - 1].alt) / Math.max(1, f.t - flight[i - 1].t) : 0)), 4);
  const spd = smoothArr(flight.map((f, i) => (i ? haversine(flight[i - 1], f) / Math.max(1, f.t - flight[i - 1].t) : 0)), 3);
  let maxAlt = -Infinity, minAlt = Infinity, trackDist = 0, maxDist = 0, maxClimb = -Infinity, maxSink = Infinity, topSpeed = 0;
  const launch = flight[0];
  for (let i = 0; i < flight.length; i++) {
    maxAlt = Math.max(maxAlt, flight[i].alt); minAlt = Math.min(minAlt, flight[i].alt);
    maxDist = Math.max(maxDist, haversine(launch, flight[i]));
    if (i) trackDist += haversine(flight[i - 1], flight[i]);
    maxClimb = Math.max(maxClimb, vario[i]); maxSink = Math.min(maxSink, vario[i]); topSpeed = Math.max(topSpeed, spd[i]);
  }
  return {
    date: parsed.dateStr || new Date().toISOString().slice(0, 10),
    glider: parsed.glider || "", pilot: parsed.pilot || "", device: parsed.device || "",
    recStart: fixes[0].t, recEnd: fixes[n - 1].t, takeoff: fixes[toIdx].t, landing: fixes[lnIdx].t,
    takeoffLat: +launch.lat.toFixed(5), takeoffLon: +launch.lon.toFixed(5),
    landLat: +flight[flight.length - 1].lat.toFixed(5), landLon: +flight[flight.length - 1].lon.toFixed(5),
    maxAlt: Math.round(maxAlt), minAlt: Math.round(minAlt), altGain: Math.round(maxAlt - launch.alt),
    maxClimb: +maxClimb.toFixed(1), maxSink: +maxSink.toFixed(1),
    trackDist: Math.round(trackDist), maxDist: Math.round(maxDist), topSpeed: Math.round(topSpeed * 3.6),
    profile: downsample(fixes.map((f) => f.alt), 150).map((a) => Math.round(a)),
    track: downsampleTrack(fixes, 170),
    score: scorePoints(flight.map((f) => [f.lat, f.lon])),
  };
}

/* ============================ formatting & location ============================ */
const fmtClock = (sec) => { sec = ((Math.round(sec) % 86400) + 86400) % 86400; return String(Math.floor(sec / 3600)).padStart(2, "0") + ":" + String(Math.floor((sec % 3600) / 60)).padStart(2, "0"); };

function trackSVG(track, w, h, sw) {

  const lat0 = track.reduce((s, p) => s + p[0], 0) / track.length, k = Math.cos((lat0 * Math.PI) / 180);
  const xs = track.map((p) => p[1] * k), ys = track.map((p) => p[0]);

  const spanX = Math.max(1e-6, maxX - minX), spanY = Math.max(1e-6, maxY - minY), pad = 12;
  const scale = Math.min((w - 2 * pad) / spanX, (h - 2 * pad) / spanY);

    '<path d="' + d + '" fill="none" stroke="' + t.track.line + '" stroke-width="' + (sw || 1.8) + '" stroke-linejoin="round" stroke-linecap="round" opacity=".96"/>' +
    '<circle cx="' + px(s[1] * k).toFixed(1) + '" cy="' + py(s[0]).toFixed(1) + '" r="3.6" fill="' + t.track.start + '"/>' +
    '<circle cx="' + px(e[1] * k).toFixed(1) + '" cy="' + py(e[0]).toFixed(1) + '" r="3.6" fill="' + t.track.end + '"/></svg>';
}

  const w = 480, min = Math.min(...profile), max = Math.max(...profile), range = Math.max(1, max - min), pad = 8;
  const X = (i) => (i / (profile.length - 1)) * w, Y = (a) => h - pad - ((a - min) / range) * (h - 2 * pad);

/* ============================ statistics ============================ */
function computeStats() {
  const fl = state.flights;
  if (!fl.length) return null;
  const totalSec = fl.reduce((s, f) => s + effDur(f), 0);
  const sites = {}, byYear = {}, byMonth = Array(12).fill(0);
  let longest = fl[0], highest = fl[0], farthest = fl[0], totalDist = 0;
  const countries = {}, localities = {};
  let bestFree = 0, bestTri = 0, bestTriType = "", bestXc = 0, bestOlc = 0;
  const xcArr = [], olcArr = [];
  for (const f of fl) {
    const site = (f.site || "Unknown").trim() || "Unknown";
    sites[site] = (sites[site] || 0) + 1;
    const y = f.date.slice(0, 4); byYear[y] = (byYear[y] || 0) + effDur(f);
    const mi = +f.date.slice(5, 7) - 1; if (mi >= 0 && mi < 12) byMonth[mi]++;
    if (effDur(f) > effDur(longest)) longest = f;
    if ((f.maxAlt || 0) > (highest.maxAlt || 0)) highest = f;
    if ((f.maxDist || 0) > (farthest.maxDist || 0)) farthest = f;
    totalDist += f.trackDist || 0;
    const sc = f.score;
    if (sc) {
      if (sc.free > bestFree) bestFree = sc.free;
      if (sc.triValid && sc.triScored > bestTri) { bestTri = sc.triScored; bestTriType = sc.isFAI ? "FAI" : "flat"; }
      if (sc.xcPoints > bestXc) bestXc = sc.xcPoints;
      if (sc.olcPoints > bestOlc) bestOlc = sc.olcPoints;
      xcArr.push(sc.xcPoints); olcArr.push(sc.olcPoints);
    }
    const p = placeOf(f);
    if (p && p.country) { const c = countries[p.country] || { count: 0, sec: 0, cc: p.countryCode }; c.count++; c.sec += effDur(f); c.cc = c.cc || p.countryCode; countries[p.country] = c; }
    if (p && (p.locality || p.region)) { const loc = p.locality || p.region; localities[loc] = (localities[loc] || 0) + 1; }
  }
  xcArr.sort((a, b) => b - a); olcArr.sort((a, b) => b - a);
  const xcTop6 = xcArr.slice(0, 6).reduce((s, v) => s + v, 0);
  const olcTop6 = olcArr.slice(0, 6).reduce((s, v) => s + v, 0);
  const years = Object.keys(byYear).sort(), thisYear = String(new Date().getFullYear());
  const topSite = Object.entries(sites).sort((a, b) => b[1] - a[1])[0];
  return {
    totalSec, count: fl.length, siteCount: Object.keys(sites).length,
    longest, highest, farthest, totalDist, avgSec: totalSec / fl.length, topSite,
    yearBars: years.map((y) => ({ label: y, value: byYear[y] })),
    monthBars: MONTHS.map((m, i) => ({ label: m, value: byMonth[i] })),
    thisYearSec: byYear[thisYear] || 0, thisYearCount: fl.filter((f) => f.date.slice(0, 4) === thisYear).length,
    countryList: Object.entries(countries).map(([name, v]) => ({ name, ...v })).sort((a, b) => b.sec - a.sec),
    siteList: Object.entries(localities).map(([name, count]) => ({ name, count })).sort((a, b) => b.count - a.count),
    bestFree, bestTri, bestTriType, bestXc, bestOlc, xcTop6, olcTop6,
  };
}

/* ============================ render ============================ */
function render() {
  const app = document.getElementById("app");
  const mark = '<svg width="26" height="26" viewBox="0 0 180 180" style="flex-shrink:0;vertical-align:middle"><path d="M16 74 Q90 26 164 74 L122 82 Q90 60 58 82 Z" fill="' + t.accent + '"/><path d="M58 82 L86 124 M122 82 L94 124" stroke="' + t.textDim + '" stroke-width="6" fill="none"/><circle cx="90" cy="138" r="9" fill="' + t.track.end + '"/></svg>';
  let html = "";
  // top bar
  html += '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;flex-wrap:wrap">' +
    '<h1 class="disp" data-act="home" style="display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;margin:0">' + mark + 'Logbook</h1>' +

    '<button class="ghost ' + (state.view === "settings" ? "on" : "") + '" data-act="nav-settings">Settings</button></div></div>';
  if (state.importMsg) html += '<div class="card" style="padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--accent);border-color:var(--accent-dim)">' + esc(state.importMsg) + '</div>';

  if (state.view === "logbook") html += renderLogbook();
  else if (state.view === "pilot") html += renderPilotLog();
  else if (state.view === "flight") html += renderFlight();
  else if (state.view === "settings") html += renderSettings();

  if (state.editId || state.adding) html += renderEdit();
  app.innerHTML = html;
  afterRender();
}
function afterRender() {
  if (state.view === "flight") {
    const f = state.flights.find((x) => x.id === state.selId);
    if (f) initFlightMap(f); else destroyMap();
  } else destroyMap();
}

function renderFlight() {
  const f = state.flights.find((x) => x.id === state.selId);
  if (!f) return "";

  const sf = trim && f.recEnd != null ? (f.takeoff - f.recStart) / Math.max(1, f.recEnd - f.recStart) : 0;
  const ef = trim && f.recEnd != null ? (f.landing - f.recStart) / Math.max(1, f.recEnd - f.recStart) : 1;
  const items = [["Airtime", fmtDur(effDur(f))], ["Takeoff", fmtClock(f.takeoff)], ["Landing", fmtClock(f.landing)],
    ["Max altitude", f.maxAlt + " m"], ["Altitude gain", f.altGain + " m"], ["Max climb", (f.maxClimb > 0 ? "+" : "") + f.maxClimb + " m/s"],
    ["Max sink", f.maxSink + " m/s"], ["Top speed", f.topSpeed + " km/h"], ["Track length", fmtDist(f.trackDist)], ["Max distance", fmtDist(f.maxDist)]];
  let h = '<button class="ghost" data-act="back" style="margin-bottom:12px;margin-left:-8px">&larr; All flights</button>';
  h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:18px"><div>' +
    '<h2 class="disp" style="font-size:26px;font-weight:800;letter-spacing:-0.5px">' + esc(f.site || "Unnamed site") + '</h2>' +
    (p ? '<div style="font-size:14px;color:var(--text-dim);margin-top:5px">' + flagEmoji(p.countryCode) + " " + esc(placeLabel(p)) + '</div>' : "") +
    '<div class="sub" style="font-size:13.5px;margin-top:3px">' + f.date + (f.glider ? " &middot; " + esc(f.glider) : "") + (f.device ? " &middot; " + esc(f.device) : "") + '</div></div>' +
    '<button class="btn" data-act="edit" data-id="' + f.id + '">Edit</button></div>';

    h += '<div class="card" style="padding:0;overflow:hidden;margin-bottom:16px"><div id="flightMap" style="height:360px;width:100%;z-index:0"></div>' + varioLegendHTML() + '</div>';
  }
  h += '<div class="card" style="padding:16px 18px;margin-bottom:16px"><div class="lbl" style="margin-bottom:8px">Altitude</div>' + altSVG(f.profile, sf, ef, 120, false) +

  const sc = f.score;
  if (sc) {
    const tri = sc.triValid
      ? fmtKm(sc.triScored) + (sc.isFAI ? " · FAI" : " · flat") + (sc.closePct != null ? " · closed " + sc.closePct + "%" : "")
      : "—";
    const xcItems = [
      ["Open distance", fmtKm(sc.straight), "straight line, 2 pts"],
      ["Free distance", fmtKm(sc.free), "up to 3 turnpoints, 5 pts"],
      ["Triangle", tri, sc.triValid ? "scored distance" : "not closed (<20%)"],
      ["XContest", fmtPts(sc.xcPoints) + " pts", sc.xcType],
      ["OLC", fmtPts(sc.olcPoints) + " pts", sc.olcType],
    ];
    h += '<div class="lbl" style="margin:22px 0 10px">Cross-country scoring</div>' +
      '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">' + xcItems.map(([k, v, sub]) =>
        '<div class="card" style="padding:13px 15px"><div class="lbl">' + k + '</div>' +
        '<div class="num" style="font-size:18px;font-weight:700;margin-top:4px">' + v + '</div>' +
        '<div class="sub" style="margin-top:3px">' + sub + '</div></div>').join("") + '</div>' +
      '<div class="sub" style="margin-top:10px">Turnpoints are optimised over a simplified track — values are a close approximation, not official league figures.</div>';
  }
  if (f.takeoffLat != null) h += '<div class="sub" style="margin-top:14px">Launch ' + f.takeoffLat + ", " + f.takeoffLon + " &rarr; landing " + f.landLat + ", " + f.landLon + '</div>';
  return h;
}

function paletteSwatch(dir) {
  const pt = themeFor(dir, state.settings.mode || "light");
  const dot = (c) => '<span style="width:16px;height:16px;border-radius:50%;background:' + c + ';box-shadow:0 0 0 1px rgba(128,128,128,.25) inset;flex-shrink:0"></span>';
  return '<div style="display:flex;gap:6px;align-items:center">' + dot(pt.bg) + dot(pt.cardBg) + dot(pt.accent) + dot(pt.track.start) + dot(pt.danger) + '</div>';
}
function renderSettings() {
  const trimmable = state.flights.filter((f) => f.recEnd != null);
  const totalGhost = trimmable.reduce((s, f) => s + Math.max(0, (f.recEnd - f.recStart) - (f.landing - f.takeoff)), 0);
  let h = "";

  // ---- Appearance ----
  h += '<div class="lbl" style="margin-bottom:8px">Appearance</div>';
  h += '<div class="card" style="padding:18px 20px;margin-bottom:20px">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px"><div>' +
    '<div style="font-weight:600;font-size:15px">Colour palette</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-top:4px;line-height:1.5;max-width:520px">Pick the look of your logbook. Each palette has a light and dark mode — toggle below.</div></div>' +
    '<div class="seg" role="group" aria-label="Light or dark mode">' +
    '<button class="' + (state.settings.mode !== "dark" ? "on" : "") + '" data-act="set-mode" data-mode="light">☀ Light</button>' +
    '<button class="' + (state.settings.mode === "dark" ? "on" : "") + '" data-act="set-mode" data-mode="dark">☾ Dark</button></div></div>' +
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">' +
    PALETTES.map(([dir, name, desc]) => {
      const on = (state.settings.direction || "topographic") === dir;
      return '<button data-act="set-palette" data-dir="' + dir + '" style="text-align:left;cursor:pointer;background:var(--input-bg);border:1.5px solid ' + (on ? "var(--accent)" : "var(--input-border)") + ';border-radius:var(--radius);padding:14px 15px;font-family:var(--font-body);box-shadow:' + (on ? "0 0 0 3px var(--accent-dim)" : "none") + ';transition:border-color .12s,box-shadow .12s">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">' +
        '<span class="disp" style="font-size:15px;font-weight:700;color:var(--text)">' + name + '</span>' +
        (on ? '<span style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.5px;text-transform:uppercase">Active</span>' : '') + '</div>' +
        paletteSwatch(dir) +
        '<div style="font-size:12px;color:var(--text-faint);margin-top:10px;line-height:1.45">' + desc + '</div></button>';
    }).join("") + '</div></div>';

  // ---- Locations ----
  h += '<div class="card" style="padding:18px 20px;margin-bottom:20px"><div style="display:flex;justify-content:space-between;align-items:center;gap:16px"><div>' +
    '<div style="font-weight:600;font-size:15px">Launch site locations</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-top:4px;line-height:1.5;max-width:520px">Country, region and nearest town are looked up from each launch’s GPS coordinates and cached, so each site is resolved once and then works offline. You can also set a location by hand on any flight via Edit. Refresh retries sites that failed (e.g. when you were offline).</div></div>' +
    '<button class="btn" data-act="refresh-loc"' + (state.geoBusy ? " disabled" : "") + '>' + (state.geoBusy ? "Looking up…" : "Refresh") + '</button></div></div>';
  h += '<div class="card" style="padding:18px 20px;margin-bottom:20px"><div style="display:flex;justify-content:space-between;align-items:center;gap:16px"><div>' +
    '<div style="font-weight:600;font-size:15px">Trim recordings to true airtime</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-top:4px;line-height:1.5;max-width:520px">FlySkyHy’s auto-end sometimes keeps recording after you land. When on, each flight’s duration and all totals use the landing detected from the GPS track instead of where the recording stopped. When off, durations match the raw recording.</div></div>' +
    '<button class="toggle" data-act="toggle-trim" style="background:' + (state.settings.trim ? "var(--accent)" : "var(--toggle-off)") + '"><span class="knob" style="left:' + (state.settings.trim ? "25px" : "3px") + '"></span></button></div>' +
    (state.settings.trim && totalGhost > 0 ? '<div style="font-size:13px;color:var(--danger);margin-top:12px">Currently reclaiming ' + fmtTotal(totalGhost) + ' of ghost time across ' + trimmable.length + ' flights.</div>' : "") + '</div>';

  // ---- Data management ----
  h += '<div class="lbl" style="margin-bottom:8px">Data</div>';
  h += '<div class="card" style="padding:6px;margin-bottom:14px">';
  if (!state.flights.length) h += '<div style="padding:14px;color:var(--text-faint);font-size:13px">No flights stored.</div>';
  else {
    const list = state.flights.slice().reverse();
    list.forEach((f, i) => {
      const pend = state.pendingDelete === f.id;
      h += '<div style="display:flex;align-items:center;gap:10px;padding:9px 10px' + (i < list.length - 1 ? ";border-bottom:1px solid var(--divider)" : "") + '">' +
        '<div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(f.site || "Unnamed site") + '</div>' +
        '<div class="sub">' + f.date + ' &middot; ' + fmtDur(effDur(f)) + '</div></div>' +
        (pend
          ? '<span style="font-size:12.5px;color:var(--danger)">Delete?</span><button class="btn danger" data-act="del-flight-yes" data-id="' + f.id + '" style="padding:5px 11px">Yes</button><button class="btn" data-act="del-flight-no" style="padding:5px 11px">No</button>'
          : '<button class="ghost" data-act="del-flight" data-id="' + f.id + '" style="color:var(--danger)">Delete</button>') + '</div>';
    });
  }
  h += '</div>';
  h += '<div class="card" style="padding:16px 18px;margin-bottom:22px;border:1px solid var(--danger-border)">';
  if (!state.confirmWipe) {
    h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div>' +
      '<div style="font-weight:600;font-size:14px">Delete all data</div>' +
      '<div class="sub" style="margin-top:3px">Removes all ' + state.flights.length + ' flights and cached locations from this device. Cannot be undone.</div></div>' +
      '<button class="btn danger" data-act="wipe"' + (state.flights.length ? "" : " disabled") + '>Delete all</button></div>';
  } else {
    h += '<div style="font-size:13.5px;color:var(--danger);margin-bottom:10px">This permanently deletes all ' + state.flights.length + ' flights and saved locations on this device. This cannot be undone.</div>' +
      '<div style="display:flex;gap:10px"><button class="btn danger" data-act="wipe-yes">Delete everything</button><button class="btn" data-act="wipe-no">Cancel</button></div>';
  }
  h += '</div>';

  // ---- Trim diagnostics (opt-in) ----
  h += '<div class="lbl" style="margin-bottom:8px">Trim diagnostics</div>' +
    '<div style="font-size:13px;color:var(--text-dim);margin-bottom:14px;line-height:1.5">For each recorded flight: the line is the altitude trace, the dashed marker shows the detected landing, and the shaded tail is recording that kept running on the ground. The struck-through figure is the original (untrimmed) duration.</div>';
  if (!trimmable.length) return h + '<div class="card" style="padding:30px;text-align:center;color:var(--text-faint)">No recorded flights to diagnose yet.</div>';
  h += '<div class="grid" style="grid-template-columns:1fr">';
  for (const f of trimmable.slice().reverse()) {
    const recD = f.recEnd - f.recStart, flightD = f.landing - f.takeoff, ghost = Math.max(0, recD - flightD);
    h += '<div class="card" style="padding:13px 16px"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">' +
      '<div style="font-weight:600;font-size:14px">' + esc(f.site) + ' <span style="color:var(--text-faint);font-weight:400;font-size:12.5px">&middot; ' + f.date + '</span></div>' +
      '<div style="font-size:13px"><span class="num" style="color:var(--accent);font-weight:700">' + fmtDur(flightD) + '</span>' +
      (ghost > 20 ? ' <span style="color:var(--danger);margin-left:8px"><s style="color:var(--text-faint)">' + fmtDur(recD) + '</s> -' + fmtDur(ghost) + '</span>' : "") + '</div></div>' +
      altSVG(f.profile, (f.takeoff - f.recStart) / Math.max(1, recD), (f.landing - f.recStart) / Math.max(1, recD), 70, true) + '</div>';
  }
  return h + '</div>';
}

function renderEdit() {
  const f = state.flights.find((x) => x.id === state.editId);
  const v = (id, val) => '<input class="input" id="' + id + '" value="' + esc(val) + '"';
  return '<div class="modal-bg" data-act="cancel-edit"><div class="card" style="width:100%;max-width:380px;padding:22px" data-stop="1">' +
    '<h2 class="disp" style="font-size:16px;text-transform:uppercase;letter-spacing:1px;margin-bottom:16px">' + (f ? "Edit flight" : "Add flight") + '</h2>' +
    '<label class="sub">Site / name</label>' + v("e_site", f ? f.site || "" : "") + ' style="margin:4px 0 12px">' +
    '<label class="sub">Date</label><input class="input" id="e_date" type="date" value="' + (f ? f.date : new Date().toISOString().slice(0, 10)) + '" style="margin:4px 0 12px">' +
    '<div style="display:flex;gap:10px"><div style="flex:1"><label class="sub">Takeoff</label>' + v("e_to", f ? fmtClock(f.takeoff) : "12:00") + ' style="margin-top:4px"></div>' +
    '<div style="flex:1"><label class="sub">Landing</label>' + v("e_ln", f ? fmtClock(f.landing) : "12:30") + ' style="margin-top:4px"></div></div>' +
    '<div class="lbl" style="margin:14px 0 6px">Location (optional override)</div>' +
    v("e_loc", f && f.placeOverride ? f.placeOverride.locality || "" : "") + ' placeholder="Locality / town" style="margin-bottom:8px">' +
    '<div style="display:flex;gap:10px"><div style="flex:2">' + v("e_cty", f && f.placeOverride ? f.placeOverride.country || "" : "") + ' placeholder="Country"></div>' +
    '<div style="flex:1">' + v("e_cc", f && f.placeOverride ? f.placeOverride.countryCode || "" : "") + ' placeholder="Code (ZA)" maxlength="2"></div></div>' +
    (f ? '<div style="font-size:11.5px;color:var(--text-faint);margin-top:8px">Editing locks this flight from being changed on re-import.</div>' : "") +
    '<div id="e_err" style="color:var(--danger);font-size:13px;margin-top:8px"></div>' +
    '<div style="display:flex;gap:10px;margin-top:18px"><button class="btn accent" data-act="save-edit" style="flex:1">Save</button>' +
    '<button class="btn" data-act="cancel-edit">Cancel</button>' + (f ? '<button class="btn danger" data-act="delete" data-id="' + f.id + '">Delete</button>' : "") + '</div></div></div>';
}

/* ============================ import / dedup / geocode ============================ */
async function handleFiles(fileList) {
  const files = Array.from(fileList).filter((f) => /\.igc$/i.test(f.name));
  const byFp = new Map(state.flights.map((f) => [f.date + "|" + f.recStart + "|" + f.recEnd, f]));
  const added = []; let dup = 0, skipped = 0; const updates = new Map();
  for (const file of files) {
    try {
      const parsed = parseIGC(await file.text());
      const a = analyze(parsed);
      if (!a) { skipped++; continue; }
      const fp = a.date + "|" + a.recStart + "|" + a.recEnd;
      const existing = byFp.get(fp);
      const siteName = file.name.replace(/\.igc$/i, "").replace(/[_-]+/g, " ").trim();
      if (existing) { dup++; if (!existing.edited) updates.set(existing.id, a); continue; }
      byFp.set(fp, true);
      added.push(Object.assign({ id: Date.now() + "-" + Math.random().toString(36).slice(2, 7), site: siteName }, a));
    } catch (e) { skipped++; }
  }
  if (added.length || updates.size) {
    state.flights = state.flights.map((f) => (updates.has(f.id) ? Object.assign({}, f, updates.get(f.id)) : f))
      .concat(added).sort((a, b) => (a.date === b.date ? a.takeoff - b.takeoff : a.date < b.date ? -1 : 1));
    await saveFlights();
  }
  state.importMsg = added.length + " imported" + (updates.size ? ", " + updates.size + " re-analyzed" : "") +
    (dup > updates.size ? ", " + (dup - updates.size) + " already in logbook" : "") + (skipped ? ", " + skipped + " skipped" : "");
  render();
  setTimeout(() => { if (state.importMsg) { state.importMsg = null; render(); } }, 5000);
  geocodeMissing();
}
async function geocodeMissing() {
  if (geoRunning) return;
  const seen = new Set(), pending = [];
  for (const f of state.flights) {
    const k = siteKey(f);
    if (!k || f.placeOverride || state.sites[k] || attempted.has(k) || seen.has(k)) continue;
    seen.add(k); pending.push([k, f.takeoffLat, f.takeoffLon]);
  }
  if (!pending.length) return;
  geoRunning = true; state.geoBusy = true; render();
  for (const [k, la, lo] of pending) {
    attempted.add(k);
    const r = await reverseGeocode(la, lo);
    state.sites[k] = r || { failed: true };
    await saveSites();
    render();
    await new Promise((res) => setTimeout(res, 700));
  }
  geoRunning = false; state.geoBusy = false; render();
}
function refreshLocations() {
  const next = {};
  for (const [k, v] of Object.entries(state.sites)) if (!v.failed) next[k] = v;
  state.sites = next; attempted.clear();
  for (const k of Object.keys(next)) attempted.add(k);
  saveSites(); render(); geocodeMissing();
}

/* ============================ events ============================ */
document.getElementById("fileInput").addEventListener("change", (e) => { if (e.target.files.length) handleFiles(e.target.files); e.target.value = ""; });
document.getElementById("folderInput").addEventListener("change", (e) => { if (e.target.files.length) handleFiles(e.target.files); e.target.value = ""; });

document.getElementById("app").addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act"), id = el.getAttribute("data-id");
  switch (act) {
    case "home": case "nav-logbook": state.view = "logbook"; state.selId = null; state.pendingDelete = null; state.confirmWipe = false; render(); break;
    case "nav-pilot": state.view = "pilot"; state.selId = null; state.pendingDelete = null; state.confirmWipe = false; render(); window.scrollTo(0, 0); break;
    case "nav-settings": state.view = "settings"; state.pendingDelete = null; state.confirmWipe = false; render(); break;
    case "import-folder": document.getElementById("folderInput").click(); break;
    case "import-files": document.getElementById("fileInput").click(); break;
    case "open": state.returnView = (state.view === "pilot" ? "pilot" : "logbook"); state.selId = id; state.view = "flight"; render(); window.scrollTo(0, 0); break;
    case "back": state.view = state.returnView || "logbook"; state.selId = null; render(); break;
    case "add": state.adding = true; render(); break;
    case "edit": state.editId = id; render(); break;
    case "toggle-trim": state.settings.trim = !state.settings.trim; saveSettings(); render(); break;
    case "set-palette": state.settings.direction = el.getAttribute("data-dir"); saveSettings(); applyTheme(); render(); break;
    case "set-mode": state.settings.mode = el.getAttribute("data-mode"); saveSettings(); applyTheme(); render(); break;
    case "refresh-loc": refreshLocations(); break;
    case "del-flight": state.pendingDelete = id; render(); break;
    case "del-flight-no": state.pendingDelete = null; render(); break;
    case "del-flight-yes": state.pendingDelete = null; removeFlight(id); render(); break;
    case "wipe": state.confirmWipe = true; render(); break;
    case "wipe-no": state.confirmWipe = false; render(); break;
    case "wipe-yes": wipeAll(); break;
    case "cancel-edit":
      // only close when the click is the backdrop itself, not the dialog contents
      if (e.target.closest('[data-stop="1"]')) break;
      state.editId = null; state.adding = false; render(); break;
    case "save-edit": saveEdit(); break;
    case "delete": deleteFlight(id); break;
  }
});

function saveEdit() {
  const g = (id) => document.getElementById(id).value;
  const t = parseClock(g("e_to")), l = parseClock(g("e_ln"));
  if (t == null || l == null) { document.getElementById("e_err").textContent = "Use HH:MM"; return; }
  let la = l; if (la < t) la += 86400;
  const patch = { site: g("e_site").trim(), date: g("e_date"), takeoff: t, landing: la, edited: true };
  const loc = g("e_loc").trim(), cty = g("e_cty").trim(), cc = g("e_cc").trim();
  if (loc || cty || cc) patch.placeOverride = { locality: loc, region: "", country: cty, countryCode: cc.toUpperCase() };
  if (state.editId) {
    state.flights = state.flights.map((f) => (f.id === state.editId ? Object.assign({}, f, patch) : f));
  } else {
    state.flights = state.flights.concat([Object.assign({ id: Date.now() + "-m", recStart: null, recEnd: null, maxAlt: 0, maxDist: 0, trackDist: 0, altGain: 0, minAlt: 0, maxClimb: 0, maxSink: 0, topSpeed: 0, profile: [], track: [] }, patch)])
      .sort((a, b) => (a.date === b.date ? a.takeoff - b.takeoff : a.date < b.date ? -1 : 1));
  }
  state.editId = null; state.adding = false;
  saveFlights(); render();
}
function removeFlight(id) {
  state.flights = state.flights.filter((f) => f.id !== id);
  saveFlights();
}
function deleteFlight(id) {
  removeFlight(id);
  state.editId = null; state.adding = false; state.view = "logbook"; state.selId = null;
  render();
}
async function wipeAll() {
  state.flights = []; state.sites = {}; attempted.clear();
  state.confirmWipe = false; state.pendingDelete = null;
  await kvSet("flights", []);
  await kvSet("sites", {});
  render();
}

/* ============================ boot ============================ */
(async function () {
  state.flights = (await kvGet("flights")) || [];
  state.sites = (await kvGet("sites")) || {};
  const st = await kvGet("settings"); if (st) state.settings = Object.assign({ trim: true, direction: "topographic", mode: "light" }, st);
  for (const k of Object.keys(state.sites)) attempted.add(k);
  state.loaded = true;
  applyTheme();
  render();
  geocodeMissing();
})();
</script>
